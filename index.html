<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Gather · Worship & Ministry Planner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <aside><a class="brand" href="#">✦ <span>gather<small>WORSHIP & MINISTRY</small></span></a>
        <p class="navlabel">YOUR WORKSPACE</p>

                <h2 id="modaltitle"></h2><button type="button" id="close" aria-label="Close">×</button>

            <div id="fields"></div><button class="primary" type="submit">Save changes</button>

    <div id="toast" role="status"></div>
    <script src="app.js"></script>
